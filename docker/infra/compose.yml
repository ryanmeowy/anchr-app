services:
  elasticsearch:
    build:
      context: ../..
      dockerfile: docker/infra/Dockerfile
    image: anchr-elasticsearch:8.18.8-ik
    container_name: elasticsearch
    environment:
      - TZ=Asia/Shanghai
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
      - xpack.ml.enabled=false
      - ingest.geoip.downloader.enabled=false
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ES_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - es_logs:/usr/share/elasticsearch/logs
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          memory: 1536M

  redis:
    image: redis:7.4.9
    container_name: redis
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
      --rename-command SHUTDOWN ""
    volumes:
      - redis_data:/data
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          memory: 512M

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-connections=80
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  es_data:
  es_logs:
  redis_data:
  mysql_data:

networks:
  backend_network:
    name: anchr-backend
    driver: bridge
