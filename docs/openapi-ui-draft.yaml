openapi: 3.0.3
info:
  title: Anchr API (UI Draft)
  version: 0.1.0
  description: |
    OpenAPI-style draft for frontend integration.
    This file is manually maintained for UI generation and may be refined later.
    Deprecated endpoint `/api/v1/gen/stream` has been removed.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Search
    description: Search and retrieval
  - name: Image
    description: Image ingestion
  - name: Auth
    description: Token and STS endpoints

paths:
  /api/v1/vision/search:
    post:
      tags: [Search]
      summary: Text search
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQueryDTO'
            examples:
              hybrid:
                value:
                  keyword: "猫咪在沙发上"
                  topK: 30
                  limit: 20
                  searchType: "0"
              vectorOnly:
                value:
                  keyword: "猫咪在沙发上"
                  topK: 20
                  limit: 20
                  searchType: "1"
              textOnly:
                value:
                  keyword: "猫咪在沙发上"
                  limit: 20
                  searchType: "2"
      responses:
        '200':
          description: Success
          headers:
            X-Strategy-Requested:
              schema: { type: string }
              description: Optional debug header (when app.debug.strategy-header-enabled=true)
            X-Strategy-Effective:
              schema: { type: string }
              description: Optional debug header
            X-Strategy-Fallback:
              schema: { type: string }
              description: Optional debug header
            X-Strategy-Fallback-Reason:
              schema: { type: string }
              description: Optional debug header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultEnvelope'

  /api/v1/vision/search-page:
    post:
      tags: [Search]
      summary: Paged text search
      operationId: searchPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchPageQueryDTO'
            examples:
              hybridFirstPage:
                value:
                  keyword: "猫咪在沙发上"
                  topK: 30
                  limit: 10
                  searchType: "0"
                  enableOcr: true
              vectorOnlyFirstPage:
                value:
                  keyword: "猫咪在沙发上"
                  topK: 10
                  limit: 10
                  searchType: "1"
                  enableOcr: true
              textOnlyFirstPage:
                value:
                  keyword: "猫咪在沙发上"
                  limit: 10
                  searchType: "2"
                  enableOcr: true
              hybridNextPage:
                value:
                  keyword: "猫咪在沙发上"
                  topK: 30
                  limit: 10
                  searchType: "0"
                  enableOcr: true
                  cursor: "opaque-cursor"
      responses:
        '200':
          description: Success
          headers:
            X-Strategy-Requested:
              schema: { type: string }
              description: Optional debug header (present on first-page query path)
            X-Strategy-Effective:
              schema: { type: string }
              description: Optional debug header
            X-Strategy-Fallback:
              schema: { type: string }
              description: Optional debug header
            X-Strategy-Fallback-Reason:
              schema: { type: string }
              description: Optional debug header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPageEnvelope'

  /api/v1/vision/similar:
    get:
      tags: [Search]
      summary: Similar search by image document id
      operationId: similarSearch
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultEnvelope'

  /api/v1/vision/hot-words:
    get:
      tags: [Search]
      summary: Get hot search words
      operationId: hotWords
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringListEnvelope'

  /api/v1/vision/search-by-image:
    post:
      tags: [Search]
      summary: Search by uploaded image
      operationId: searchByImage
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Success
          headers:
            X-Strategy-Requested:
              schema: { type: string }
            X-Strategy-Effective:
              schema: { type: string }
            X-Strategy-Fallback:
              schema: { type: string }
            X-Strategy-Fallback-Reason:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultEnvelope'

  /api/v1/vision/analyze/stream:
    post:
      tags: [Search]
      summary: Stream image analysis result
      operationId: analyzeByImageStream
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                mode:
                  type: string
                  default: general
                enableOcr:
                  type: boolean
                  default: true
                enableGraph:
                  type: boolean
                  default: true
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/vision/vector-compare:
    post:
      tags: [Search]
      summary: Compare two multimodal inputs by vector similarity
      operationId: vectorCompare
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [leftType, rightType]
              properties:
                leftType:
                  type: string
                  enum: [text, image]
                leftText:
                  type: string
                  maxLength: 500
                leftFile:
                  type: string
                  format: binary
                rightType:
                  type: string
                  enum: [text, image]
                rightText:
                  type: string
                  maxLength: 500
                rightFile:
                  type: string
                  format: binary
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorCompareEnvelope'

  /api/v1/image/batch-process:
    post:
      tags: [Image]
      deprecated: true
      summary: Batch process uploaded images
      description: |
        Deprecated. Please use `/api/v1/image/batch-tasks` for async task submission.

        Integrated UI flow:
        1) client gets encrypted STS from `/api/v1/auth/sts`
        2) client uploads files to OSS directly
        3) client submits OSS keys to this endpoint
      operationId: imageBatchProcess
      security:
        - AccessTokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 20
              items:
                $ref: '#/components/schemas/BatchProcessDTO'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUploadResultEnvelope'
        '401':
          description: Access token invalid or expired

  /api/v1/image/batch-tasks:
    post:
      tags: [Image]
      summary: Submit async batch task
      operationId: createImageBatchTask
      security:
        - AccessTokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 20
              items:
                $ref: '#/components/schemas/BatchProcessDTO'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTaskStatusEnvelope'
        '401':
          description: Access token invalid or expired

  /api/v1/image/batch-tasks/{taskId}:
    get:
      tags: [Image]
      summary: Query async batch task status
      operationId: getImageBatchTask
      security:
        - AccessTokenHeader: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTaskStatusEnvelope'
        '401':
          description: Access token invalid or expired

  /api/v1/image/batch-tasks/{taskId}/items/{itemId}/retry:
    post:
      tags: [Image]
      summary: Retry one failed image item in async batch task
      operationId: retryImageBatchTaskItem
      security:
        - AccessTokenHeader: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTaskStatusEnvelope'
        '401':
          description: Access token invalid or expired

  /api/v1/image/batch-tasks/{taskId}/retry-failed:
    post:
      tags: [Image]
      summary: Retry all failed image items in async batch task
      operationId: retryAllFailedImageBatchTaskItems
      security:
        - AccessTokenHeader: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTaskStatusEnvelope'
        '401':
          description: Access token invalid or expired

  /api/v1/auth/refresh-token:
    get:
      tags: [Auth]
      summary: Refresh upload token (admin)
      operationId: authRefreshToken
      security:
        - AdminSecretHeader: []
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringEnvelope'
        '403':
          description: Unauthorized access

  /api/v1/auth/clean-token:
    get:
      tags: [Auth]
      summary: Clean upload token (admin)
      operationId: authCleanToken
      security:
        - AdminSecretHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
        '403':
          description: Unauthorized access

  /api/v1/auth/sts:
    get:
      tags: [Auth]
      summary: Get encrypted STS token payload
      description: |
        Returns unified DTO in `data` with encrypted credential payload,
        not plaintext credentials.
        Frontend should treat decrypt material as sensitive and never auto-load from `.env`.
      operationId: authGetSts
      security:
        - AccessTokenHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCredentialEnvelope'
        '401':
          description: Access token invalid or expired

components:
  securitySchemes:
    AdminSecretHeader:
      type: apiKey
      in: header
      name: X-Admin-Secret
    AccessTokenHeader:
      type: apiKey
      in: header
      name: X-Access-Token

  schemas:
    SearchQueryDTO:
      type: object
      properties:
        keyword:
          type: string
          maxLength: 50
          description: Required by backend controller logic
        topK:
          type: integer
          minimum: 1
          maximum: 200
          nullable: true
          description: |
            Vector recall size (KNN `k`).
            Effective for HYBRID (`searchType=0`) and VECTOR_ONLY (`searchType=1`).
            Ignored for TEXT_ONLY (`searchType=2`).
        pageNo:
          type: integer
        similarity:
          type: number
          format: float
          deprecated: true
        enableOcr:
          type: boolean
        searchType:
          type: string
          description: "0:HYBRID, 1:VECTOR_ONLY, 2:TEXT_ONLY, 3:IMAGE_TO_IMAGE"
          enum: ["0", "1", "2", "3"]
        limit:
          type: integer
          minimum: 1
          maximum: 200
          description: |
            Maximum number of results returned by API.
            For VECTOR_ONLY, keep `limit` equal to `topK`.
        searchAfter:
          type: array
          items: {}

    SearchPageQueryDTO:
      type: object
      properties:
        keyword:
          type: string
          maxLength: 50
        topK:
          type: integer
          minimum: 1
          maximum: 200
          nullable: true
          description: |
            Vector recall size (KNN `k`) for first-page retrieval.
            Effective for HYBRID (`searchType=0`) and VECTOR_ONLY (`searchType=1`).
            Ignored for TEXT_ONLY (`searchType=2`).
        enableOcr:
          type: boolean
        searchType:
          type: string
          description: "0:HYBRID, 1:VECTOR_ONLY, 2:TEXT_ONLY, 3:IMAGE_TO_IMAGE"
          enum: ["0", "1", "2", "3"]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            Page size and final returned item upper bound per page.
            For VECTOR_ONLY, keep `limit` equal to `topK`.
        cursor:
          type: string
          description: Opaque cursor for next page; omit on first page.

    GraphTripleDTO:
      type: object
      properties:
        s: { type: string }
        p: { type: string }
        o: { type: string }

    SearchResultDTO:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        score:
          type: number
          format: double
        ocrText: { type: string }
        highlight:
          type: string
          description: ES highlight snippet for matched content. May include highlight wrappers (for example <em>...</em>). UI should prefer this snippet and gracefully fallback when absent.
        filename: { type: string }
        sortValues:
          type: array
          items: {}
        tags:
          type: array
          items: { type: string }
        relations:
          type: array
          items:
            $ref: '#/components/schemas/GraphTripleDTO'
        vectorHitStatus:
          type: string
          enum: [VECTOR_ONLY_LIKE, VECTOR_AND_TEXT, TEXT_ONLY]

    BatchProcessDTO:
      type: object
      required: [key, fileName, fileHash]
      properties:
        key:
          type: string
          description: OSS object key
        fileName:
          type: string
        fileHash:
          type: string

    BatchFailureItem:
      type: object
      properties:
        filename: { type: string }
        errorMessage: { type: string }
        objectKey: { type: string }

    BatchUploadResultDTO:
      type: object
      properties:
        total: { type: integer }
        successCount: { type: integer }
        failureCount: { type: integer }
        failures:
          type: array
          items:
            $ref: '#/components/schemas/BatchFailureItem'

    BatchTaskItemStatusDTO:
      type: object
      properties:
        itemId: { type: string }
        key: { type: string }
        fileName: { type: string }
        fileHash: { type: string }
        status: { type: string, example: PENDING }
        errorMessage: { type: string }
        retryCount: { type: integer }
        updatedAt: { type: integer, format: int64 }

    BatchTaskStatusDTO:
      type: object
      properties:
        taskId: { type: string }
        status: { type: string, example: RUNNING }
        total: { type: integer }
        successCount: { type: integer }
        failureCount: { type: integer }
        runningCount: { type: integer }
        pendingCount: { type: integer }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        completedAt: { type: integer, format: int64, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchTaskItemStatusDTO'

    VectorCompareResultDTO:
      type: object
      properties:
        leftType: { type: string, enum: [text, image] }
        rightType: { type: string, enum: [text, image] }
        cosineSimilarity:
          type: number
          format: double
          description: Cosine similarity in range [-1, 1].
        scorePercent:
          type: number
          format: double
          description: Normalized score in range [0, 100].
        matchLevel:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        leftDimension: { type: integer }
        rightDimension: { type: integer }
        leftNorm:
          type: number
          format: double
        rightNorm:
          type: number
          format: double
        leftCacheHit:
          type: boolean
        rightCacheHit:
          type: boolean
        elapsedMs:
          type: integer
          format: int64

    SearchResultEnvelope:
      type: object
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: Success }
        data:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultDTO'
        timestamp: { type: integer, format: int64 }

    SearchPageDTO:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultDTO'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean

    SearchPageEnvelope:
      type: object
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: Success }
        data:
          $ref: '#/components/schemas/SearchPageDTO'
        timestamp: { type: integer, format: int64 }

    BatchUploadResultEnvelope:
      type: object
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: Success }
        data:
          $ref: '#/components/schemas/BatchUploadResultDTO'
        timestamp: { type: integer, format: int64 }

    BatchTaskStatusEnvelope:
      type: object
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: Success }
        data:
          $ref: '#/components/schemas/BatchTaskStatusDTO'
        timestamp: { type: integer, format: int64 }

    VectorCompareEnvelope:
      type: object
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: Success }
        data:
          $ref: '#/components/schemas/VectorCompareResultDTO'
        timestamp: { type: integer, format: int64 }

    StringEnvelope:
      type: object
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: Success }
        data: { type: string }
        timestamp: { type: integer, format: int64 }

    UploadCredentialDTO:
      type: object
      properties:
        encryptedCredential:
          type: string

    UploadCredentialEnvelope:
      type: object
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: Success }
        data:
          $ref: '#/components/schemas/UploadCredentialDTO'
        timestamp: { type: integer, format: int64 }

    StringListEnvelope:
      type: object
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: Success }
        data:
          type: array
          items: { type: string }
        timestamp: { type: integer, format: int64 }

    NullEnvelope:
      type: object
      properties:
        code: { type: integer, example: 200 }
        message: { type: string, example: Success }
        data: { nullable: true }
        timestamp: { type: integer, format: int64 }
