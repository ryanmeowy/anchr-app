spring:
  application:
    name: anchr
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  capability-provider:
    rerank: ${APP_CAPABILITY_PROVIDER_RERANK:aliyun}
    gen: ${APP_CAPABILITY_PROVIDER_GEN:aliyun}
    ocr: ${APP_CAPABILITY_PROVIDER_OCR:aliyun}
    object-storage: ${APP_CAPABILITY_PROVIDER_OBJECT_STORAGE:aliyun}
  security:
    admin-secret: ${APP_ADMIN_SECRET}
    encrypt-key: ${APP_ENCRYPT_KEY}
    encrypt-iv: ${APP_ENCRYPT_IV}
  embedding:
    backend: ${APP_EMBEDDING_BACKEND:aliyun}
    model: ${APP_EMBEDDING_MODEL:multimodal-embedding-v1}
    dimension: ${APP_EMBEDDING_DIMENSION:1024}
    preprocess-version: ${APP_EMBEDDING_PREPROCESS_VERSION:v1}
    image-input-mode: ${APP_EMBEDDING_IMAGE_INPUT_MODE:url}
  vector:
    index-name: ${APP_VECTOR_INDEX_NAME:smart_gallery}
    indexVersion: ${APP_VECTOR_INDEX_VERSION:v1}
    read-alias: ${APP_VECTOR_READ_ALIAS:smart_gallery_read}
    write-alias: ${APP_VECTOR_WRITE_ALIAS:smart_gallery_write}
    dimension: ${APP_VECTOR_DIMENSION:${APP_EMBEDDING_DIMENSION:1024}}
  kb-segment:
    index-name: ${APP_KB_SEGMENT_INDEX_NAME:kb_segment}
    indexVersion: ${APP_KB_SEGMENT_INDEX_VERSION:v1}
    read-alias: ${APP_KB_SEGMENT_READ_ALIAS:kb_segment_read}
    write-alias: ${APP_KB_SEGMENT_WRITE_ALIAS:kb_segment_write}
    dimension: ${APP_KB_SEGMENT_DIMENSION:${APP_EMBEDDING_DIMENSION:1024}}
  search:
    quality-absolute-min-score: 0.72
    vector-min-score: 0.6
    escli:
      # Optional allowlist for ES CLI accessible indices (supports wildcard '*').
      # When empty, defaults to vector read/write alias and physical index.
      allowed-index-patterns: []
    rrf:
      enabled: true
      native-enabled: false
      rank-constant: 60
      candidate-multiplier: 4
      max-candidates: 200
    rerank:
      enabled: true
      model: gte-rerank-v2
      max-doc-chars: 1200
      window-enabled: true
      window-size: 40
      window-factor: 3
      window-min: 20
      window-max: 80
      fusion-alpha: 0.6
      fusion-beta: 0.4
  compare:
    max-text-length: 500
    high-threshold: 0.8
    medium-threshold: 0.6
  debug:
    strategy-header-enabled: false

logging:
  level:
    co.elastic.clients: WARN
    org.springframework.boot.autoconfigure.elasticsearch: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

grpc:
  client:
    vision-python-service:
      address: ${VISION_PYTHON_SERVICE_ADDRESS:static://127.0.0.1:50051}
      negotiation-type: ${VISION_PYTHON_SERVICE_NEGOTIATION_TYPE:plaintext}
  deadline:
    embed-image-ms: ${GRPC_DEADLINE_EMBED_IMAGE_MS:5000}
    embed-text-ms: ${GRPC_DEADLINE_EMBED_TEXT_MS:5000}
    ocr-ms: ${GRPC_DEADLINE_OCR_MS:8000}
    generate-filename-ms: ${GRPC_DEADLINE_GENERATE_FILENAME_MS:3000}
    generate-tags-ms: ${GRPC_DEADLINE_GENERATE_TAGS_MS:8000}
    generate-graph-ms: ${GRPC_DEADLINE_GENERATE_GRAPH_MS:10000}
    parse-graph-ms: ${GRPC_DEADLINE_PARSE_GRAPH_MS:8000}
    stream-caption-ms: ${GRPC_DEADLINE_STREAM_CAPTION_MS:20000}
    rerank-ms: ${GRPC_DEADLINE_RERANK_MS:5000}

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:}
    public-endpoint: ${OSS_PUBLIC_ENDPOINT:}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
    role-arn: ${ALIYUN_OSS_ROLE_ARN:}
  ocr:
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    endpoint: ${OCR_ENDPOINT:}
