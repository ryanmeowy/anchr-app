server:
  address: ${SERVER_HOST}
  port: ${SERVER_PORT}
spring:
  profiles:
    active: ${PROFILES_ACTIVE}
  application:
    name: anchr
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      # Placeholder like the three lines above, so a deployment can see from this file which
      # database it uses. The default keeps every existing caller on db 0; the demo deployment
      # sets SPRING_DATA_REDIS_DATABASE=4 to keep its tokens and quota counters out of db 0.
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 3000ms
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  security:
    admin-secret: ${APP_ADMIN_SECRET}
    encrypt-key: ${APP_ENCRYPT_KEY}
  # Demo deployment only. Every value carries a default so a deployment that never sets
  # these keys starts exactly as before, and the feature stays inert while enabled=false.
  demo:
    enabled: ${APP_DEMO_ENABLED:false}
    token-ttl-hours: ${APP_DEMO_TOKEN_TTL_HOURS:2}
    token-quota: ${APP_DEMO_TOKEN_QUOTA:10}
    daily-operation-limit: ${APP_DEMO_DAILY_OPERATION_LIMIT:80}
    daily-token-limit: ${APP_DEMO_DAILY_TOKEN_LIMIT:50}
    issue-cooldown-minutes: ${APP_DEMO_ISSUE_COOLDOWN_MINUTES:10}
    upload-max-files: ${APP_DEMO_UPLOAD_MAX_FILES:1}
    # Alibaba Cloud CAPTCHA 2.0. Runs in mainland China, unlike Cloudflare Turnstile, whose
    # script is unreliable for visitors without a proxy.
    captcha-enabled: ${APP_DEMO_CAPTCHA_ENABLED:true}
    captcha-scene-id: ${APP_DEMO_CAPTCHA_SCENE_ID:}
    captcha-prefix: ${APP_DEMO_CAPTCHA_PREFIX:}
    captcha-region: ${APP_DEMO_CAPTCHA_REGION:cn-shanghai}
    captcha-access-key-id: ${APP_DEMO_CAPTCHA_ACCESS_KEY_ID:}
    captcha-access-key-secret: ${APP_DEMO_CAPTCHA_ACCESS_KEY_SECRET:}
    # Encryption mode (V3): the browser receives an AES token instead of the raw scene id.
    captcha-ekey: ${APP_DEMO_CAPTCHA_EKEY:}
    captcha-encrypt-scene-id: ${APP_DEMO_CAPTCHA_ENCRYPT_SCENE_ID:false}
    captcha-scene-id-ttl-seconds: ${APP_DEMO_CAPTCHA_SCENE_ID_TTL_SECONDS:3600}
    # Boot with the demo already stopped; a restart never reopens a switch someone closed.
    start-closed: ${APP_DEMO_START_CLOSED:false}
  docling:
    base-url: ${APP_DOCLING_BASE_URL}
    api-token: ${APP_DOCLING_API_TOKEN}
logging:
  level:
    co.elastic.clients: WARN
    org.springframework.boot.autoconfigure.elasticsearch: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
