server:
  address: ${SERVER_HOST}
  port: ${SERVER_PORT}
spring:
  devtools:
    livereload:
      enabled: false
  profiles:
    active: dev
  application:
    name: anchr
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3000ms
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  conversation:
    intent-routing:
      enabled: ${APP_CONVERSATION_INTENT_ROUTING_ENABLED:true}
      context-turn-limit: ${APP_CONVERSATION_INTENT_CONTEXT_TURN_LIMIT:5}
      timeout: ${APP_CONVERSATION_INTENT_TIMEOUT:5s}
  security:
    admin-secret: ${APP_ADMIN_SECRET}
    encrypt-key: ${APP_ENCRYPT_KEY}
    encrypt-iv: ${APP_ENCRYPT_IV}
  embedding:
    ingestion-min-interval-ms: ${APP_EMBEDDING_INGESTION_MIN_INTERVAL_MS:1500}
    ingestion-rate-limit-max-attempts: ${APP_EMBEDDING_INGESTION_RATE_LIMIT_MAX_ATTEMPTS:5}
    ingestion-rate-limit-backoff-ms: ${APP_EMBEDDING_INGESTION_RATE_LIMIT_BACKOFF_MS:5000}
  outbox:
    poll-interval-ms: ${APP_OUTBOX_POLL_INTERVAL_MS:3000}
    batch-size: ${APP_OUTBOX_BATCH_SIZE:20}
    lock-lease-minutes: ${APP_OUTBOX_LOCK_LEASE_MINUTES:5}
    max-attempts: ${APP_OUTBOX_MAX_ATTEMPTS:10}
    retention-days: ${APP_OUTBOX_RETENTION_DAYS:90}
    cleanup-batch-size: ${APP_OUTBOX_CLEANUP_BATCH_SIZE:1000}
    cleanup-cron: "${APP_OUTBOX_CLEANUP_CRON:0 0 3 * * *}"
  docling:
    base-url: ${APP_DOCLING_BASE_URL}
    api-token: ${APP_DOCLING_API_TOKEN}
    poll-interval: ${APP_DOCLING_POLL_INTERVAL:2s}
    max-wait: ${APP_DOCLING_MAX_WAIT:45m}
    max-resubmits: ${APP_DOCLING_MAX_RESUBMITS:2}
  segment:
    index-name: kb_segment
    read-alias: kb_segment_read
    write-alias: kb_segment_write
  search:
    rrf:
      rank-constant: 60
      candidate-multiplier: 4
      max-candidates: 200
    rerank:
      max-doc-chars: 1200
      window-enabled: true
      window-size: 40
      window-factor: 3
      window-min: 20
      window-max: 80
      fusion-alpha: 0.6
      fusion-beta: 0.4

logging:
  level:
    co.elastic.clients: WARN
    org.springframework.boot.autoconfigure.elasticsearch: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
